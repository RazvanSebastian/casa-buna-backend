spring:
  application:
    name: casabuna-backend
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-secret
          keycloak:
            client-id: test-client-id
            client-secret: test-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:9000/realms/casa-buna-keycloack
            user-name-attribute: preferred_username

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyThatIsAtLeast32CharactersLongForHS256Security!}
  expiration: 604800000 # 7 days
  isSecured: false

logging:
  level:
    org.springframework.security: OFF
    org.springframework.security.oauth2: OFF
